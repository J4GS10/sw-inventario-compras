# Nginx del frontend: sirve la SPA y hace de proxy inverso al backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: resuelve `backend` en cada peticion (sobrevive a
  # que el contenedor del backend se recree con otra IP).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:3000;

  # gzip para los estaticos
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA: cualquier ruta que no sea un archivo -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache larga para los assets con hash
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Canal en vivo (SSE): sin buffer y con lectura larga, o los avisos llegan tarde / se cortan.
  location = /api/com/notificaciones/stream {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Proxy inverso: /api/* -> contenedor backend
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass $backend_upstream/health;
  }
}
