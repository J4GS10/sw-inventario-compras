# ============================================================================
# Orquestacion local del ERP (skills/stack-tecnologico.md 4).
# Red privada `inventory-net`, volumen persistente para Oracle, backend y
# frontend contenerizados.
#
#   docker compose up -d --build
#   # una sola vez, para crear el esquema + datos semilla contra la BD del compose:
#   docker compose run --rm --entrypoint sh db-init -c "cd /repo && pnpm db:deploy:full"
#
# Nota: Oracle no publica una imagen 21c en Docker Hub sin login a
# container-registry.oracle.com. Se usa `gvenzl/oracle-free` (Oracle DB 23 Free,
# superset SQL de 21c) para un arranque turnkey. Para 21c oficial, cambiar la
# imagen del servicio `oracle` y ajustar DB_CONNECT_STRING.
# ============================================================================

name: sw-inventario

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:-admin123}
      APP_USER: ${DB_USER:-admin_proyecto}
      APP_USER_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks: [inventory-net]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # Almacenamiento de objetos S3-compatible para los adjuntos de documentos.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [inventory-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Crea el bucket una vez y termina.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-com-adjuntos} &&
      echo 'bucket ${S3_BUCKET:-com-adjuntos} listo'"
    networks: [inventory-net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      HTTP_PORT: "3000"
      DB_USER: ${DB_USER:-admin_proyecto}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      # gvenzl expone el PDB como FREEPDB1; el APP_USER vive ahi.
      DB_CONNECT_STRING: oracle:1521/FREEPDB1
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env para produccion}
      # Adjuntos -> MinIO del compose.
      S3_BUCKET: ${S3_BUCKET:-com-adjuntos}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      ADJUNTO_MAX_BYTES: ${ADJUNTO_MAX_BYTES:-15728640}
    depends_on:
      oracle:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks: [inventory-net]
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    networks: [inventory-net]
    ports:
      - "8443:80"
    restart: unless-stopped

  # Utilitario opcional para aplicar DDL + DML contra la BD del compose.
  # No arranca solo: se invoca con `docker compose run --rm db-init ...`.
  db-init:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /repo
    entrypoint: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm db:deploy:full"]
    environment:
      DB_USER: ${DB_USER:-admin_proyecto}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_CONNECT_STRING: oracle:1521/FREEPDB1
    volumes:
      - .:/repo
    depends_on:
      oracle:
        condition: service_healthy
    networks: [inventory-net]

volumes:
  oracle-data:
  minio-data:

networks:
  inventory-net:
    driver: bridge
