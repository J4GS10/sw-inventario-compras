# ============================================================================
# Orquestacion local del ERP (skills/stack-tecnologico.md 4).
# Red privada `inventory-net`; backend, frontend y MinIO contenerizados.
#
# Base de datos: Oracle 21c Enterprise instalado en el HOST (no en Docker).
# Los contenedores llegan a el por `host.docker.internal:1521`, PDB `PROYECTO`
# (usuario ADMIN_PROYECTO, importado desde database/backup/*.DMP).
# Se cambia con DB_CONNECT_STRING_DOCKER en `.env`.
#
#   docker compose up -d --build
#   # migraciones idempotentes + verificacion del esquema (opcional):
#   docker compose run --rm db-init
# ============================================================================

name: sw-inventario

x-oracle-host: &oracle-host
  DB_USER: ${DB_USER:-admin_proyecto}
  DB_PASSWORD: ${DB_PASSWORD:-admin123}
  DB_CONNECT_STRING: ${DB_CONNECT_STRING_DOCKER:-host.docker.internal:1521/proyecto}

services:
  # Almacenamiento de objetos S3-compatible para los adjuntos de documentos.
  # MinIO ya no publica imagenes en Docker Hub/Quay; se usa el build de Bitnami
  # (mismo servidor MinIO), que ademas crea el bucket al arrancar.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-com-adjuntos}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    networks: [inventory-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *oracle-host
      NODE_ENV: production
      HTTP_PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env para produccion}
      # Acceso rapido por perfil en el login (0 = ocultarlo).
      APP_LOGIN_DEMO: ${APP_LOGIN_DEMO:-1}
      # Adjuntos -> MinIO del compose.
      S3_BUCKET: ${S3_BUCKET:-com-adjuntos}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      ADJUNTO_MAX_BYTES: ${ADJUNTO_MAX_BYTES:-15728640}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
    networks: [inventory-net]
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    networks: [inventory-net]
    ports:
      - "8443:80"
    restart: unless-stopped

  # Utilitario opcional: migraciones idempotentes + verificacion del esquema
  # contra el Oracle del host. No arranca solo: `docker compose run --rm db-init`.
  db-init:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /repo
    entrypoint: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile --ignore-scripts --filter @sw-inventario/backend... && pnpm db:deploy"]
    environment:
      <<: *oracle-host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/repo
    networks: [inventory-net]

volumes:
  minio-data:

networks:
  inventory-net:
    driver: bridge
